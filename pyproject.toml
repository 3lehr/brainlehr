# Paketbau fuer brainlehrs Kern -- damit ein Fremder installieren kann,
# statt das Repo zu klonen (2026-08-21).
#
# LIZENZ: AGPL-3.0, wie das Repo. NICHT MIT -- MIT gilt allein fuer den
# Hermes-Adapter unter integrations/hermes/plugin/, und genau diese Grenze
# ist der Grund, warum brainlehr dort ein optionaler Zusatz ist und keine
# Vorgabe-Abhaengigkeit.
#
# WAS DRIN IST, und warum es eine Liste und kein Glob ist: die 39 Dateien
# unten sind GEMESSEN, nicht geraten -- der Kern wurde in ein leeres
# Verzeichnis kopiert und jeder ModuleNotFoundError nachgezogen, bis
# initialize / tools/list / knowledge_stats / knowledge_search /
# knowledge_add durchliefen (runs/paketbau_2026-08-21.json). Ein Glob ueber
# kern/ waere 121 Dateien statt 36 und wuerde bei jeder neuen Datei
# stillschweigend mitwachsen. Dazu die zwei verzoegerten Importe, die auf
# genau diesen Wegen sitzen: kern/nachrangung.py (knowledge_search, ab zwei
# Treffern) und kern/knowledge_lint.py samt Anhang (Normkonflikt-Pruefung in
# knowledge_add) -- letzteres ist im Server in ein try/except gehuellt, ein
# Fehlen waere also eine LAUTLOS abgeschaltete Pruefung gewesen.
#
# WAS BEWUSST DRAUSSEN BLEIBT: brainlehr.db (230 MB, Daten Dritter), runs/,
# messungen/, spikes/, backups/, sicherungen/, docs/, auszug/, .claude/,
# und die uebrigen 85 Module in kern/ (Melder, Cronjobs, Auswertungen), die
# fuer die drei Werkzeuge des Hermes-Adapters nicht gebraucht werden.
#
# LAYOUT: alles landet unter dem Paket `brainlehr_kern/` in derselben
# Verzeichnisform wie im Repo. Das ist keine Kosmetik -- knowledge_mcp_server.py
# sucht seine Wurzel an schema.sql und legt danach `kern`, `haken`, `melder`
# in den Suchpfad; eine flache Installation haette `import embeddings`,
# `import ausweis` usw. als Top-Level-Module ins site-packages jedes Nutzers
# gelegt. Weil der Server diesen Suchpfad selbst setzt, braucht der
# Einstiegspunkt kein eigenes Startmodul.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brainlehr"
version = "0.1.0"
description = "Local knowledge store with enforced provenance, validity and release scope -- MCP server over stdio. No API key, no cloud."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Leer und das ist der Punkt: der Kern laeuft auf SQLite/FTS5 und der
# Standardbibliothek (requirements.txt sagt das selbst im Kopf).
dependencies = []

[project.optional-dependencies]
# Der Bedeutungskanal: lokale Einbettungen, PCA-Ansicht des Wissensraums und
# die signierte Auditkette. Ohne sie sucht brainlehr rein lexikalisch (FTS5)
# weiter -- ein Ausfall der Einbettungen blockiert die Suche nie.
bedeutungskanal = ["numpy>=1.26", "scikit-learn>=1.4", "cryptography>=42"]
# Kollaborativer Dokumentdienst; der MCP-Kern importiert beides nicht beim Start.
dokumentfenster = ["pycrdt>=0.14", "websockets>=15"]

[dependency-groups]
# Core MCP startup/import smoke is stdlib-only. These groups make optional
# semantic/security paths, tests and release construction reproducible.
dev = ["pytest>=8", "cryptography>=42", "pycrdt>=0.14", "websockets>=15"]
build = ["build>=1.5", "hatchling>=1.32"]

[project.scripts]
# Damit ein Klient `brainlehr-mcp` eintragen kann statt eines Dateipfads.
brainlehr-mcp = "brainlehr_kern.knowledge_mcp_server:main"
# Ohne das ist eine Installation nur der halbe Weg: der Server laeuft, aber
# niemand hat je eine Datenbank angelegt. Gemessen 2026-08-23 am Erstlauf.
brainlehr-einrichten = "brainlehr_kern.schnellstart:main"
brainlehr-boundary = "brainlehr_kern.project_boundary_cli:main"
brainlehr-impact-view = "brainlehr_kern.project_impact_cli:main"

[project.urls]
Homepage = "https://github.com/3lehr/brainlehr"

[tool.hatch.build.targets.sdist]
# GEMESSEN, nicht angenommen: ohne diese Liste legt hatchling ALLES ins
# sdist, was nicht in .gitignore steht -- der erste Lauf am 2026-08-21 ergab
