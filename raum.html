<title>brainlehr — Wissensraum</title>

<style>
:root{
  --grund:#FAF8F4; --tief:#F0ECE4; --tinte:#15171B; --leise:#5C5E66; --still:#8C8E96;
  --linie:#DCD7CD; --da:#B8651A; --lehre:#2F6F68; --spur:#8A4FA8; --fehlt:#A9A49A;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --grund:#0B0D11; --tief:#13161B; --tinte:#ECE9E2; --leise:#9A9CA4; --still:#6A6D75;
  --linie:#242830; --da:#E09A44; --lehre:#63B0A5; --spur:#B07FD0; --fehlt:#4E525A;}}
:root[data-theme="dark"]{--grund:#0B0D11;--tief:#13161B;--tinte:#ECE9E2;--leise:#9A9CA4;
  --still:#6A6D75;--linie:#242830;--da:#E09A44;--lehre:#63B0A5;--spur:#B07FD0;--fehlt:#4E525A;}
:root[data-theme="light"]{--grund:#FAF8F4;--tief:#F0ECE4;--tinte:#15171B;--leise:#5C5E66;
  --still:#8C8E96;--linie:#DCD7CD;--da:#B8651A;--lehre:#2F6F68;--spur:#8A4FA8;--fehlt:#A9A49A;}

body{background:var(--grund);color:var(--tinte);font-family:var(--sans);line-height:1.55;}
.rahmen{max-width:76rem;margin:0 auto;padding:1.4rem clamp(.8rem,2.5vw,1.6rem) 3rem;
  display:flex;flex-direction:column;gap:1rem;}
h1{font-family:var(--serif);font-size:clamp(1.4rem,3vw,1.9rem);margin:0;font-weight:600;letter-spacing:-.01em;}
.unter{color:var(--leise);font-size:.9rem;max-width:66ch;margin:0;}

.leiste{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;
  background:var(--tief);border:1px solid var(--linie);border-radius:3px;padding:.55rem .7rem;}
button{font:inherit;font-size:.82rem;background:transparent;color:var(--leise);
  border:1px solid var(--linie);border-radius:2px;padding:.3rem .7rem;cursor:pointer;}
button:hover{color:var(--tinte);border-color:var(--still);}
button[aria-pressed="true"]{background:var(--tinte);color:var(--grund);border-color:var(--tinte);}
button:focus-visible{outline:2px solid var(--da);outline-offset:2px;}
.trenn{width:1px;height:1.3rem;background:var(--linie);}
label{font-size:.78rem;color:var(--still);font-family:var(--mono);}
input[type=range]{accent-color:var(--da);width:min(22rem,42vw);}
.stand{font-family:var(--mono);font-size:.78rem;color:var(--leise);
  font-variant-numeric:tabular-nums;min-width:9.5rem;}

.buehne{position:relative;background:var(--tief);border:1px solid var(--linie);border-radius:3px;}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab;}
canvas:active{cursor:grabbing;}
.fahne{position:absolute;pointer-events:none;background:var(--grund);color:var(--tinte);
  border:1px solid var(--still);border-radius:2px;padding:.4rem .55rem;font-size:.76rem;
  max-width:26rem;line-height:1.4;opacity:0;transition:opacity .1s;box-shadow:0 2px 10px rgba(0,0,0,.18);}
.fahne .weg{font-family:var(--mono);font-size:.68rem;color:var(--still);display:block;margin-top:.2rem;
  word-break:break-all;}
.hinweis{position:absolute;left:.7rem;bottom:.6rem;font-family:var(--mono);font-size:.7rem;
  color:var(--still);pointer-events:none;}

.legende{display:flex;flex-wrap:wrap;gap:1rem;font-size:.78rem;color:var(--leise);}
.legende b{display:inline-flex;align-items:center;gap:.4rem;font-weight:400;}
.pkt{width:9px;height:9px;border-radius:50%;flex:none;}

.fuss{border-top:1px solid var(--linie);padding-top:.9rem;font-size:.76rem;color:var(--still);
  display:flex;flex-direction:column;gap:.35rem;}
code{font-family:var(--mono);font-size:.9em;}
@media (max-width:40rem){input[type=range]{width:100%;}}
nav.brainlehr-nav{display:flex;gap:1rem;font-size:.85rem;}
nav.brainlehr-nav a{color:var(--da);text-decoration:none;}
nav.brainlehr-nav a:hover{text-decoration:underline;}
nav.brainlehr-nav a:focus-visible{outline:2px solid var(--da);outline-offset:2px;}
nav.brainlehr-nav a[aria-current="page"]{color:var(--tinte);font-weight:600;text-decoration:none;}
</style>

<div class="rahmen">
  <nav class="brainlehr-nav" aria-label="Wissensraum-Werkzeuge">
    <a href="/">Entscheidungen</a>
    <a href="/raum" aria-current="page">Raum</a>
  </nav>
  <div>
    <h1>Wissensraum</h1>
    <p class="unter">3010 Einträge, gemessen am 2026-08-08. Drei Anordnungen desselben
      Bestands — der Zeitregler wirkt in allen. Die Ansicht zeigt nur; sie verknüpft,
      löscht und ändert nichts.</p>
  </div>

  <div class="leiste">
    <button id="b0" aria-pressed="true">Baum</button>
    <button id="b1" aria-pressed="false">Bedeutung</button>
    <button id="b2" aria-pressed="false">Spuren</button>
    <span class="trenn"></span>
    <label for="zeit">Zeit</label>
    <input type="range" id="zeit" min="0" max="100" value="100">
    <span class="stand" id="stand"></span>
    <span class="trenn"></span>
    <button id="lauf" aria-pressed="false">Ablauf</button>
  </div>

  <div class="buehne">
    <canvas id="c" width="1520" height="880"></canvas>
    <div class="fahne" id="fahne"></div>
    <div class="hinweis" id="hinweis"></div>
  </div>

  <div class="legende">
    <b><i class="pkt" style="background:var(--da)"></i>Wissensknoten</b>
    <b><i class="pkt" style="background:var(--lehre)"></i>Lehre</b>
    <b><i class="pkt" style="background:var(--fehlt)"></i>noch nie abgerufen</b>
    <b><i class="pkt" style="background:var(--spur)"></i>gemeinsam abgerufen</b>
    <b>Größe = wie oft ausgeliefert</b>
  </div>

  <div class="fuss" id="fuss"></div>
</div>

<script>
let D = null;
fetch('/api/raum').then(r=>r.json()).then(d=>{ D=d; starte(); })
  .catch(()=>{ document.getElementById('hinweis').textContent='Daten nicht erreichbar'; });

function starte(){
const c = document.getElementById('c'), g = c.getContext('2d');
const fahne = document.getElementById('fahne'), hinweis = document.getElementById('hinweis');
const P = D.punkte, N = P.length;
let ansicht = 0, drehX = -0.35, drehY = 0.6, zoom = 1, zeitAnteil = 1, spielt = false;

const tage = [...new Set(P.map(p=>p.d).filter(Boolean))].sort();
const t0 = tage[0], t9 = tage[tage.length-1];
const evz = [...new Set(D.ereignisse.map(e=>e.t))].sort();

// --- Baum-Anordnung: Position ist eine Adresse, keine Projektion ---
const aeste = {};
P.forEach((p,i)=>{ (aeste[p.a] = aeste[p.a] || []).push(i); });
const astNamen = Object.keys(aeste).sort((a,b)=>aeste[b].length-aeste[a].length);
const baum = new Float32Array(N*2);
{
  // Kacheln proportional zur Wurzel der Anzahl, Zeilenumbruch
  let x=0, y=0, zeilenH=0; const B=1520-80;
  astNamen.forEach(a=>{
    const n = aeste[a].length, seite = Math.max(46, Math.sqrt(n)*13);
    if (x + seite > B) { x = 0; y += zeilenH + 30; zeilenH = 0; }
    const spalten = Math.ceil(Math.sqrt(n));
    aeste[a].forEach((idx,k)=>{
      const r = Math.floor(k/spalten), s = k % spalten;
      baum[idx*2]   = 40 + x + (s+0.5)*(seite/spalten);
      baum[idx*2+1] = 70 + y + (r+0.5)*(seite/spalten);
    });
    aeste[a].kachel = {x:40+x, y:70+y, s:seite};
    x += seite + 26; zeilenH = Math.max(zeilenH, seite);
  });
}

function sichtbar(i){
  const d = P[i].d; if(!d) return true;
  return d <= grenzTag();
}
function grenzTag(){
  const k = Math.min(tage.length-1, Math.floor(zeitAnteil*(tage.length-1)));
  return tage[k];
}
function grenzEreignis(){
  const k = Math.min(evz.length-1, Math.floor(zeitAnteil*(evz.length-1)));
  return evz[k];
}

const bild = new Float32Array(N*3);
function rechnePlatz(){
  const W=c.width, H=c.height, cx=W/2, cy=H/2;
  const sx=Math.sin(drehX), kx=Math.cos(drehX), sy=Math.sin(drehY), ky=Math.cos(drehY);
  for(let i=0;i<N;i++){
    if(ansicht===0){ bild[i*3]=baum[i*2]; bild[i*3+1]=baum[i*2+1]; bild[i*3+2]=0; continue; }
    const v=P[i].v; let x=v[0],y=v[1],z=v[2];
    let x1=x*ky - z*sy, z1=x*sy + z*ky;
    let y1=y*kx - z1*sx, z2=y*sx + z1*kx;
    const s=380*zoom/(2.6+z2);
    bild[i*3]=cx+x1*s*1.9; bild[i*3+1]=cy+y1*s*1.9; bild[i*3+2]=z2;
  }
}

function farbe(p, hell){
  if(!p.h) return getComputedStyle(document.documentElement).getPropertyValue('--fehlt');
  return getComputedStyle(document.documentElement).getPropertyValue(p.k==='l'?'--lehre':'--da');
}
let cDa, cLehre, cFehlt, cSpur, cLinie, cStill;
function ladeFarben(){
  const s=getComputedStyle(document.documentElement);
  cDa=s.getPropertyValue('--da').trim(); cLehre=s.getPropertyValue('--lehre').trim();
  cFehlt=s.getPropertyValue('--fehlt').trim(); cSpur=s.getPropertyValue('--spur').trim();
  cLinie=s.getPropertyValue('--linie').trim(); cStill=s.getPropertyValue('--still').trim();
}

function zeichne(){
  ladeFarben(); rechnePlatz();
  g.clearRect(0,0,c.width,c.height);

  if(ansicht===0){
    g.strokeStyle=cLinie; g.lineWidth=1; g.font='11px ui-monospace,monospace';
    astNamen.forEach(a=>{
      const k=aeste[a].kachel; if(!k) return;
      g.strokeRect(k.x-7, k.y-7, k.s+14, k.s+14);
      g.fillStyle=cStill; g.fillText(a+'  '+aeste[a].length, k.x-7, k.y-13);
    });
  }

  const gz = ansicht===2 ? grenzEreignis() : null;
  if(ansicht===2){
    // Spuren: gemeinsam abgerufene Paare, bis zum Zeitpunkt
    const zaehler = new Map();
    for(const e of D.ereignisse){
      if(e.t > gz) break;
      for(let a=0;a<e.n.length;a++) for(let b=a+1;b<e.n.length;b++){
        const s=e.n[a]+'_'+e.n[b]; zaehler.set(s,(zaehler.get(s)||0)+1);
      }
    }
    g.lineCap='round';
    for(const [s,w] of zaehler){
      if(w<2) continue;
      const [a,b]=s.split('_').map(Number);
      g.strokeStyle=cSpur; g.globalAlpha=Math.min(.75,.18+w*.09); g.lineWidth=Math.min(4,.8+w*.35);
      g.beginPath(); g.moveTo(bild[a*3],bild[a*3+1]); g.lineTo(bild[b*3],bild[b*3+1]); g.stroke();
    }
    g.globalAlpha=1;
  } else {
    // gesetzte Beziehungen — nur die geprueften, nie aus Naehe erzeugte
    g.strokeStyle=cStill; g.globalAlpha=.5; g.lineWidth=1;
    for(const k of D.gesetzt){
      if(!sichtbar(k.a)||!sichtbar(k.b)) continue;
      g.beginPath(); g.moveTo(bild[k.a*3],bild[k.a*3+1]); g.lineTo(bild[k.b*3],bild[k.b*3+1]); g.stroke();
    }
    g.globalAlpha=1;
  }

  const reihe = ansicht===0 ? null : [...Array(N).keys()].sort((a,b)=>bild[b*3+2]-bild[a*3+2]);
  const durch = reihe || [...Array(N).keys()];
  let gezeigt=0;
  for(const i of durch){
    if(ansicht!==2 && !sichtbar(i)) continue;
    const p=P[i];
    const r = Math.max(1.3, Math.min(7, 1.5 + Math.sqrt(p.h||0)*1.15)) * (ansicht===0?1:zoom*0.85);
    g.fillStyle = p.h ? (p.k==='l'?cLehre:cDa) : cFehlt;
    g.globalAlpha = p.h ? 0.92 : 0.42;
    g.beginPath(); g.arc(bild[i*3],bild[i*3+1],r,0,6.2832); g.fill();
    gezeigt++;
  }
  g.globalAlpha=1;
  hinweis.textContent = ansicht===2
    ? 'Abrufe bis '+grenzEreignis().replace('T',' ')
    : gezeigt+' von '+N+' Einträgen · angelegt bis '+grenzTag();
}

// --- Bedienung ---
let zieht=false, lx=0, ly=0;
c.addEventListener('pointerdown',e=>{ if(ansicht===0) return; zieht=true; lx=e.clientX; ly=e.clientY; c.setPointerCapture(e.pointerId); });
c.addEventListener('pointerup',e=>{ zieht=false; });
c.addEventListener('pointermove',e=>{
  const rect=c.getBoundingClientRect(), sk=c.width/rect.width;
  if(zieht){ drehY += (e.clientX-lx)*0.006; drehX += (e.clientY-ly)*0.006; lx=e.clientX; ly=e.clientY; zeichne(); return; }
  const mx=(e.clientX-rect.left)*sk, my=(e.clientY-rect.top)*sk;
  let best=-1, bd=210;
  for(let i=0;i<N;i++){
    if(ansicht!==2 && !sichtbar(i)) continue;
    const dx=bild[i*3]-mx, dy=bild[i*3+1]-my, d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=i; }
  }
  if(best<0){ fahne.style.opacity=0; return; }
  const p=P[best];
  fahne.innerHTML = (p.k==='l'?'Lehre · ':'Knoten · ') + (p.a) +
    (p.h ? ' · '+p.h+'× ausgeliefert' : ' · noch nie ausgeliefert') +
    '<br>' + p.t.replace(/</g,'&lt;') + '<span class="weg">' + (p.p||'') + (p.d? ' · '+p.d : '') + '</span>';
  fahne.style.opacity=1;
  fahne.style.left = Math.min(rect.width-330, e.clientX-rect.left+14)+'px';
  fahne.style.top  = Math.max(4, e.clientY-rect.top-14)+'px';
});
c.addEventListener('pointerleave',()=>{ fahne.style.opacity=0; zieht=false; });
c.addEventListener('wheel',e=>{ if(ansicht===0) return; e.preventDefault();
  zoom = Math.max(.4, Math.min(4, zoom*(e.deltaY>0?0.92:1.08))); zeichne(); },{passive:false});

const stand=document.getElementById('stand');
function setzeStand(){ stand.textContent = ansicht===2 ? grenzEreignis().replace('T',' ') : grenzTag(); }
document.getElementById('zeit').addEventListener('input',e=>{
  zeitAnteil = e.target.value/100; setzeStand(); zeichne();
});
[0,1,2].forEach(k=>{
  document.getElementById('b'+k).addEventListener('click',()=>{
    ansicht=k; [0,1,2].forEach(j=>document.getElementById('b'+j).setAttribute('aria-pressed', j===k?'true':'false'));
    setzeStand(); zeichne();
  });
});
let timer=null;
document.getElementById('lauf').addEventListener('click',e=>{
  spielt=!spielt; e.target.setAttribute('aria-pressed',spielt?'true':'false');
  if(timer){ clearInterval(timer); timer=null; }
  if(spielt){
    let v=0; const s=document.getElementById('zeit');
    timer=setInterval(()=>{ v+=1; if(v>100){ v=0; } s.value=v; zeitAnteil=v/100; setzeStand(); zeichne(); },90);
  }
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',zeichne);

document.getElementById('fuss').innerHTML =
  '<div>Der <b>Baum</b> setzt jeden Eintrag an seine Adresse — keine Projektion, kein Informationsverlust. '+
  'Nachbarschaft heißt dort <em>gleicher Ast</em>, nicht <em>ähnlicher Inhalt</em>.</div>'+
  '<div><b>Bedeutung</b> ist eine lineare Projektion aus 1024 Dimensionen auf drei. Die drei Achsen tragen '+
  (D.varianz.map(v=>(v*100).toFixed(1)+'&thinsp;%').join(' · '))+' der Streuung. Nähe ist hier <em>Modell-Nachbarschaft</em>, nicht geprüfte Verwandtschaft.</div>'+
  '<div><b>Spuren</b> zeigt, welche Einträge gemeinsam ausgeliefert wurden — gemessen, nicht projiziert. '+
  'Eine Linie bedeutet <em>kam zusammen vor</em>, nicht <em>hängt zusammen</em> und schon gar nicht <em>führt zu</em>.</div>'+
  '<div>Graue Linien sind die '+D.gesetzt.length+' von Hand gesetzten Beziehungen, deren beide Enden auffindbar sind. '+
  'Es wird keine Linie gezeichnet, die aus bloßer Nähe entstünde.</div>'+
  '<div>Nicht dargestellt, weil nicht auflösbar: 572 Treffer im Abrufprotokoll zeigen auf Pfade, die es seit '+
  'der Pfadsäuberung nicht mehr gibt. Das Protokoll war zum Schreibzeitpunkt richtig — es verweist nur auf '+
  'einen veränderlichen Schlüssel statt auf die Kennung.</div>';


setzeStand(); zeichne();
}

</script>
