# Die Verpackung, unter der Fremde dieses Plugin erwarten.
#
# GRUPPENNAME: `hermes_agent.plugins` -- der EINZIGE, den Hermes liest
# (hermes_cli/plugins.py::ENTRY_POINTS_GROUP = "hermes_agent.plugins",
# gelesen in _scan_entry_points()). Ein anderer Name waere ein Paket, das
# sich sauber installiert und nie erscheint.
#
# DER BEFUND DAZU, offen benannt: Hermes' CONTRIBUTING.md sagt,
# `discover_memory_providers()` finde Plugins "from user/project plugin
# directories and pip entry points". Der Code tut das nicht --
# `plugins/memory/__init__.py::_iter_provider_dirs()` durchsucht
# ausschliesslich Verzeichnisse. Eintragspunkte liest nur der ALLGEMEINE
# Plugin-Lader, und dessen Weiterleitung an die Speicher-Auffindung haengt
# daran, ein Verzeichnis mit `__init__.py` zu lesen, das ein Eintragspunkt
# nicht hat. Bis das behoben ist, bleibt der Symlink nach
# ~/.hermes/plugins/brainlehr der Weg, der nachweislich traegt. Diese Datei
# steht trotzdem hier: sie ist das, was ihre Anleitung verlangt, und sie
# wirkt in dem Moment, in dem der Lader nachzieht.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-brainlehr"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"   # wie brainlehr: fuehrende Null als Aussage, nicht als Platzhalter
description = "brainlehr as a Hermes memory provider -- local knowledge store with enforced provenance, validity and release scope. No API key, no cloud."
requires-python = ">=3.11"
dependencies = []

# ZUSATZ, NICHT VORGABE -- und der Grund ist die Lizenz, nicht der Geschmack:
# dieser Adapter steht unter MIT, brainlehr selbst unter AGPL-3.0. Wer ein
# MIT-Paket installiert, soll nicht stillschweigend AGPL-Software ins System
# bekommen. Zulaessig waere es (getrennte Werke, Aufruf ueber MCP in einem
# eigenen Prozess -- keine Verlinkung), aber es gehoert sichtbar gemacht.
# Als Zusatz ist es eine Entscheidung des Nutzers:
#     pip install hermes-brainlehr[brainlehr]
# Ohne den Zusatz bleibt der Adapter benutzbar: er zeigt dann auf ein
# vorhandenes brainlehr (Einstellung `brainlehr_home` bzw. `mcp_command`).
[project.optional-dependencies]
brainlehr = ["brainlehr>=0.1.0"]

# DIE GRUPPE HEISST memory_providers, NICHT plugins -- und das ist die Falle,
# an der dieses Paket bis 2026-08-23 haengengeblieben waere.
#
# Hermes hat ZWEI Konstanten desselben Namens mit VERSCHIEDENEN Werten:
#   hermes_cli/plugins.py:399        ENTRY_POINTS_GROUP = "hermes_agent.plugins"
#   plugins/memory/__init__.py:50    ENTRY_POINTS_GROUP = "hermes_agent.memory_providers"
# Gesucht werden Speicher-Anbieter ausschliesslich ueber die zweite
# (_iter_entry_points(), von dort in discover_memory_providers()). Die erste
# ist der allgemeine Plugin-Weg. Wir standen auf der ersten und waeren nie
# gefunden worden -- ohne Fehler, ohne Protokollzeile.
#
# Die Dokumentation nennt die Gruppe an keiner Stelle (CONTRIBUTING.md sagt nur
# "or via a pip entry point"), und keiner der acht mitgelieferten Anbieter
# liefert ein pyproject.toml, an dem man es haette ablesen koennen. Gemessen
# gegen Hermes 1684877868.
# Der Wert zeigt auf die KLASSE, nicht auf das Modul. entry_point.load() gibt
# zurueck, worauf gezeigt wird -- ein Modul ist weder Instanz noch Klasse noch
# aufrufbar, und _load_provider_from_entry_point() faellt dann durch alle vier
# Zweige und liefert None. Die Klasse trifft den zweiten Zweig
# (issubclass(..., MemoryProvider)) und wird instanziiert.
[project.entry-points."hermes_agent.memory_providers"]
brainlehr = "brainlehr_provider:BrainlehrProvider"

[tool.setuptools]
packages = []
py-modules = ["brainlehr_provider", "cli", "config_schema"]
