# Warum dieser Lauf existiert
#
# Vom 2026-08-17 bis zum 2026-08-20 stand dieses Repository oeffentlich unter
# MIT, waehrend AGPL-3.0 plus CLA beschlossen war. MIT kam als Vorgabewert
# beim Neuanlegen des Export-Verzeichnisses hinein und wurde nie wieder
# angefasst -- die Lizenzdatei stand auf einer "gehoert dem Ziel, nie
# ueberschreiben"-Liste.
#
# Der Test dagegen lag danach im Repo und lief NICHT: keine Hooks, keine CI.
# Ein Melder ohne Ausloeser zaehlt als keiner. Und ein Hook unter .git/hooks/
# waere der falsche Ort gewesen -- der ist nicht versioniert und haette genau
# das naechste Neuanlegen des Verzeichnisses nicht ueberlebt, also den Fall,
# der den Fehler erzeugt hat.
#
# Dieser Lauf wandert mit dem Repo mit und laeuft bei jedem Push und jedem
# Pull Request, auch bei fremden.
name: Lizenz

on:
  push:
  pull_request:

jobs:
  lizenz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lizenz ist AGPL und steht dort, wo sie gelesen wird
        run: python -m pytest -q tests/test_lizenz.py
